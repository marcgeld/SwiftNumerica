name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, and run examples
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Describe package
        run: swift package describe

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build and run examples
        working-directory: Examples
        run: |
          set -euo pipefail

          swift build

          for directory in Sources/*/; do
            example="$(basename "$directory")"
            echo "::group::${example}"
            swift run -q "$example"
            echo "::endgroup::"
          done
